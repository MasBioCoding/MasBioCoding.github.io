<style>
/* Layout: one column on a felt table. The folded invitation stands in a square slot that the flat sheet fills exactly
   once it is open; everything a guest does happens on the paper itself, and a single line below it talks back. */
:root {
  --table: #d3d8ca;
  --table-edge: #c4cab9;
  --fg: #1f2630;
  --fg-soft: #4e5848;
  --pen: #2a49b8;
  --pen-tint: rgba(42, 73, 184, .08);
  --line: rgba(31, 38, 48, .2);
  --shadow: rgba(36, 46, 30, .3);
  --font: "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif;
  --font-hand: Caveat, "Bradley Hand", "Segoe Print", cursive;
  --step--1: .875rem; --step-0: 1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #1b201a; --table-edge: #232a21; --fg: #e6e9dd; --fg-soft: #a9b19f; --pen: #9db0ff; --pen-tint: rgba(157, 176, 255, .12);
    --line: rgba(230, 233, 221, .18); --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #1b201a; --table-edge: #232a21; --fg: #e6e9dd; --fg-soft: #a9b19f; --pen: #9db0ff; --pen-tint: rgba(157, 176, 255, .12);
  --line: rgba(230, 233, 221, .18); --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
}
html, body { overflow-x: clip; }
body {
  background: var(--table) radial-gradient(ellipse at 50% 30%, var(--table-edge), var(--table) 70%) no-repeat;
  color: var(--fg); font: 400 var(--step-0)/1.5 var(--font); -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 620px; margin: 0 auto; display: grid; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(48px, 14vw, 110px) 72px;
}
.slot { position: relative; z-index: 2; width: 100%; max-width: 100%; aspect-ratio: 1; }
#gl { position: absolute; left: 50%; top: 50%; width: 160%; height: 160%; transform: translate(-50%, -50%); pointer-events: none;
  filter: drop-shadow(0 var(--sy, 30px) var(--sb, 22px) var(--shadow)); }
#flat { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; filter: drop-shadow(0 3px 6px var(--shadow)); }
.slot.open #flat { opacity: 1; visibility: visible; transition: opacity .25s ease-out; }
.slot.open #gl { visibility: hidden; transition: visibility 0s .3s; }
.hit { position: absolute; inset: 10%; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
.hit:focus-visible { outline: 2px dashed var(--pen); outline-offset: 6px; }
.slot.open .hit, .slot.away .hit { display: none; }
/* the controls on the paper: invisible over the printed words, so the paper itself is the form */
.paper-ui { position: absolute; inset: 0; display: none; }
.slot.open .paper-ui { display: block; }
.pbtn { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; border-radius: 4px; cursor: pointer; color: transparent; font-size: 1px; }
.pbtn:hover { background: rgba(42, 73, 184, .07); }
.pbtn:focus-visible { outline: 2px dashed #2a49b8; outline-offset: 2px; }
.pname { position: absolute; border: 0; padding: 0 0 0 .2em; margin: 0; background: transparent; color: #2747b5; font: 500 calc(var(--u, 1px) * var(--hand, 18)) / 1 var(--font-hand);
  border-radius: 3px; outline: none; }
.pname:focus { background: rgba(42, 73, 184, .06); }
.pname::placeholder { color: rgba(39, 71, 181, .35); }
.row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 8px 16px; min-height: 1.6em; text-align: center; }
.hint { margin: 0; color: var(--fg-soft); font-size: var(--step--1); letter-spacing: .02em; max-width: 46ch; text-wrap: balance; }
.idle .hint { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .55; } }
.hint.warn { color: var(--fg); }
.link { font: inherit; font-size: var(--step--1); color: var(--pen); background: none; border: 0; padding: 4px 0; cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.link:focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; border-radius: 2px; }
.sent { display: grid; gap: 10px; justify-items: center; text-align: center; }
.sent p { margin: 0; max-width: 46ch; }
.sent pre { justify-self: stretch; text-align: left; white-space: pre-wrap; font: 400 var(--step--1)/1.55 var(--font); margin: 0; padding: 12px 14px;
  border-left: 3px solid var(--pen); background: var(--pen-tint); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .idle .hint { animation: none; } }
</style>

// ---------- the text, exactly as written ----------
const TITLE = 'Niet schrikken!';
const BODY = 'Je bent gewoon uitgenodigd voor een diner/lunch waarbij we de toekomst van de natuur gaan bespreken. Staan er straks nog wel koeien in de wei! Of zijn het vegetarische leeuwen? Een automatische bioloog? Of killer robots die al het zand op aarde tot chips omsmelten?! Waarschijnlijk niet, maar van alle rare scenario’s die je wel of niet kunt bedenken gaan er toch een paar gebeuren. Nu is volgens mij het moment om te speculeren, bestuderen en educeren. Ik hoop dat je kunt komen, laat het weten!';
const DATES_HEAD = 'Data rsvp (november):', CLICK = ' (klik op data)';
const DAYS = [
  {d: 3, wd: 'di', slots: ['12:00–14:00', '16:00–18:00', '19:00–21:00']},
  {d: 4, wd: 'wo', slots: ['14:00–16:00', '16:00–18:00']},
  {d: 5, wd: 'do', slots: ['12:00–14:00', '15:00–17:00']},
  {d: 7, wd: 'za', slots: ['12:00–14:00', '16:00–18:00', '19:00–21:00']},
  {d: 9, wd: 'ma', slots: ['18:00–21:00']},
];
const SLOTS = DAYS.flatMap(D => D.slots.map((s, i) => ({id: D.d + '-' + i, label: `${D.wd} ${D.d} nov ${s}`, day: D, time: s})));
const selected = new Set();

// ---------- the printed sheet: laid out in units of a 400-unit square, drawn at any resolution ----------
const SHEET = 400, MARGIN = 24, PAPER = '#fbf8f1', INK = '#1b1f27', PEN = '#2747b5';
const FONT = '"Helvetica Neue", Helvetica, Arimo, Arial, sans-serif', HAND = 'Caveat, "Bradley Hand", "Segoe Print", cursive';
const F = (w, s) => `${w} ${s}px ${FONT}`;
// the photo is printed with a little taken off both sides
const CROP = {x: 70, y: 0, w: 830, h: 664}, ASPECT = CROP.w / CROP.h;
let LAY = null, IMG = null;
function tryLayout(m, s, pw){
  const W = SHEET - 2 * MARGIN, items = [], slots = {};
  const put = (str, font, x, y) => { m.font = font; items.push({font, x, y, s: str}); return x + m.measureText(str).width; };
  let y = MARGIN;
  const ts = s * 1.8; y += ts * .9; put(TITLE, F(700, ts), MARGIN, y);
  y += s * .55;
  m.font = F(400, s); const lh = s * 1.36;
  let line = '', lines = [];
  for (const w of BODY.split(' ')){ const t = line ? line + ' ' + w : w; if (line && m.measureText(t).width > W){ lines.push(line); line = w; } else line = t; }
  lines.push(line);
  for (const l of lines){ y += lh; put(l, F(400, s), MARGIN, y - s * .32); }
  y += s * .55 + lh;
  const hx = put(DATES_HEAD, F(700, s), MARGIN, y - s * .32); put(CLICK, F(400, s), hx, y - s * .32);
  // below: the dates, the name and klaar on the left; the photo on the right
  const top = y + s * .45, ph = pw / ASPECT, photo = {x: SHEET - MARGIN - pw, y: top + s * .2, w: pw, h: ph};
  const right = photo.x - s * .9, dl = s * 1.5;
  let yy = top;
  for (const D of DAYS){
    yy += dl; let base = yy - s * .42;
    let x = put(String(D.d), F(700, s), MARGIN, base); x = put(' (', F(400, s), x, base); const indent = x;
    D.slots.forEach((t, i) => {
      m.font = F(400, s); let sep = i ? ' of ' : '';
      if (x + m.measureText(sep + t).width > right){ yy += dl * .86; base = yy - s * .42; x = indent; sep = i ? 'of ' : ''; }
      if (sep) x = put(sep, F(400, s), x, base);
      const x0 = x; x = put(t, F(400, s), x, base); slots[D.d + '-' + i] = {x: x0, y: base - s * .82, w: x - x0, h: s * 1.08};
    });
    x = put(')', F(400, s), x, base);
    if (x > right + s * .6) return null;
  }
  yy += dl * 1.35; const nb = yy - s * .42, nx = put('Naam:', F(700, s), MARGIN, nb);
  const name = {x: nx + s * .3, y: nb - s * 1.25, w: right - nx - s * .3, h: s * 1.6, base: nb};
  yy += dl * 1.25; const kb = yy - s * .42, kx = put('(klaar)', F(700, s), MARGIN, kb);
  const klaar = {x: MARGIN, y: kb - s * .85, w: kx - MARGIN, h: s * 1.1};
  const bottom = Math.max(yy + s * .1, photo.y + ph);
  if (name.w < s * 6 || bottom > SHEET - MARGIN) return null;
  return {items, slots, s, photo, name, klaar};
}
function layout(){
  const m = document.createElement('canvas').getContext('2d');
  for (let s = 14; s >= 7; s -= .1) for (const pw of [190, 180, 170, 160, 150, 140]){ const L = tryLayout(m, s, pw); if (L) return L; }
}
// seeded randomness so the paper's fibres and the pen circles look the same everywhere
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// print: 0 = blank side, 1 = printed side, 2 = printed side with the guest's handwriting
function paint(ctx, px, print){
  ctx.save(); ctx.setTransform(px, 0, 0, px, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, SHEET, SHEET);
  if (print && IMG){ const p = LAY.photo; ctx.drawImage(IMG, CROP.x, CROP.y, CROP.w, CROP.h, p.x, p.y, p.w, p.h);
    ctx.globalAlpha = .07; ctx.fillStyle = PAPER; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.globalAlpha = 1; }
  const r = rng(7);
  for (let i = 0; i < 2600; i++){ // fibres
    const x = r() * SHEET, y = r() * SHEET, a = r() * Math.PI, l = .4 + r() * 2.2;
    ctx.strokeStyle = r() < .5 ? 'rgba(120,96,60,.07)' : 'rgba(255,255,255,.5)'; ctx.lineWidth = .18 + r() * .25;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke(); }
  // the crease pattern of the crane, pressed into the paper
  ctx.lineCap = 'round';

  if (!r.ok){ p.textContent = 'Versturen lukte niet. Controleer je verbinding en probeer het opnieuw.'; sent.append(p); }
  else if (CONFIG.mode === 'preview'){ p.textContent = 'Dit is een voorbeeld, er is niets verstuurd. Dit zou er binnenkomen:'; const pre = document.createElement('pre'); pre.textContent = r.m.text; sent.append(p, pre); }
  else { p.textContent = `Dank je, ${r.m.name}! De kraanvogel brengt je antwoord.`; sent.append(p); }
  const back = document.createElement('button'); back.type = 'button'; back.className = 'link'; back.textContent = 'Laat de kraanvogel terugkomen';
  back.addEventListener('click', comeBack); sent.append(back); say('');
}
function comeBack(){
  sent.hidden = true; nobodyWarned = false;
  if (!G || reduce.matches){ slot.classList.remove('away'); state = 'idle'; stage.classList.add('idle'); return unfold(); }
  slot.classList.remove('away'); glc.style.opacity = 1; state = 'returning'; t0 = performance.now(); kick();
  slot.scrollIntoView({behavior: 'smooth', block: 'center'});
}
$('hit').addEventListener('click', unfold);
document.addEventListener('visibilitychange', () => { if (!document.hidden && /ing$/.test(state)) kick(); });

// ---------- the controls on the paper ----------
function buildUI(){
  ui.innerHTML = ''; const pct = v => (v / SHEET * 100).toFixed(3) + '%', pad = LAY.s * .45;
  const place = (el, b, px = pad, py = pad) => Object.assign(el.style, {left: pct(b.x - px), top: pct(b.y - py), width: pct(b.w + 2 * px), height: pct(b.h + 2 * py)});
  for (const sl of SLOTS){ const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn'; b.id = 'slot-' + sl.id;
    b.setAttribute('aria-pressed', selected.has(sl.id) ? 'true' : 'false'); b.textContent = `${sl.day.wd} ${sl.day.d} november, ${sl.time.replace('–', ' tot ')}`;
    place(b, LAY.slots[sl.id], LAY.s * .2, LAY.s * .5); b.addEventListener('click', () => toggle(sl.id)); ui.append(b); }
  const old = $('pname'), inp = document.createElement('input'); inp.type = 'text'; inp.id = 'pname'; inp.className = 'pname'; inp.autocomplete = 'name';
  inp.setAttribute('aria-label', 'Je naam'); inp.maxLength = 60; inp.value = old ? old.value : ''; inp.spellcheck = false;
  place(inp, LAY.name, 0, 0); slot.style.setProperty('--hand', (LAY.s * 1.45).toFixed(2));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); klaar(); } });
  ui.append(inp);
  const k = document.createElement('button'); k.type = 'button'; k.className = 'pbtn'; k.id = 'klaar'; k.textContent = 'Klaar, verstuur mijn antwoord';
  place(k, LAY.klaar, LAY.s * .5, LAY.s * .5); k.addEventListener('click', klaar); ui.append(k);
}
function toggle(id){
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  $('slot-' + id).setAttribute('aria-pressed', selected.has(id) ? 'true' : 'false'); nobodyWarned = false;
  if (hint.classList.contains('warn')) open();
  paintFlat();
}

// ---------- sending ----------
function message(){
  const name = $('pname').value.trim(), picks = SLOTS.filter(s => selected.has(s.id)).map(s => s.label);
  return {name, text: `Naam: ${name}\n\n` + (picks.length ? 'Kan op:\n' + picks.join('\n') : 'Kan op geen van deze data.')};
}
async function deliver(m){
  if (CONFIG.mode === 'web3forms'){
    const r = await fetch('https://api.web3forms.com/submit', {method: 'POST', headers: {'Content-Type': 'application/json', Accept: 'application/json'},
      body: JSON.stringify({access_key: CONFIG.web3formsKey, subject: 'Uitnodiging: antwoord van ' + m.name, from_name: m.name, message: m.text})});
    const j = await r.json().catch(() => ({})); if (!r.ok || j.success === false) throw new Error(j.message || r.status);
  } else if (CONFIG.mode === 'ntfy'){
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(CONFIG.ntfyTopic), {method: 'POST', headers: {Title: 'Uitnodiging: ' + m.name}, body: m.text});
    if (!r.ok) throw new Error(r.status);
  }
}

// ---------- start: fonts and photo first, so the folded paper already carries the printed text ----------
(async () => {
  const img = new Image(); img.src = PHOTO;
  const fonts = [F(400, 13), F(700, 13), `500 18px ${HAND}`];
  try { await Promise.race([Promise.all([...fonts.map(f => document.fonts.load(f, 'Niet schrikken! 12:00–14:00 ’')), img.decode()]), new Promise(r => setTimeout(r, 3500))]); } catch (x) {}
  if (img.complete && img.naturalWidth) IMG = img;
  LAY = layout(); buildUI();
  try { G = initGL(); } catch (x) { G = null; }
  resize();
  if (G){ upload('back'); upload('front'); state = 'idle'; kick(); }
  else open();
  new ResizeObserver(() => resize()).observe(slot);
  window.__inv = {renderT: t => { state = 'debug'; const u = t / TOTAL, k = smooth(clamp01((u - .06) / .88)); draw(arcAt(t), slerp(restQ(), [1, 0, 0, 0], k), LIFT * (1 - smooth(Math.min(1, u / .5))), k); shadow(k); },
    fly: t => { state = 'debug'; const f = flight(t); draw(f.A, qmul(qaxis(0, 0, 1, f.nose), restQ()), LIFT, 0, f.off, 1 - f.fade); },
    TOTAL, FLY, setView: (y, p, r) => Object.assign(VIEW, {yaw: y, pitch: p, roll: r ?? VIEW.roll}), get state(){ return state; }, unfold, layout: () => LAY};
})();
</script>
