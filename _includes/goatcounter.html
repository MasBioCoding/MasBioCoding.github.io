{%- assign goatcounter_endpoint = site.goatcounter.endpoint | default: "" | strip -%}
{%- if jekyll.environment == "production" and goatcounter_endpoint != "" -%}
<script>
  window.goatcounter = window.goatcounter || {};
</script>
<script
  data-goatcounter="{{ goatcounter_endpoint | escape }}"
  async
  src="https://gc.zgo.at/count.js"></script>
{%- endif -%}
